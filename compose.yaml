# Local development stack. Credentials here are for localhost only and never used elsewhere.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ziftbook
      POSTGRES_PASSWORD: ziftbook
      POSTGRES_DB: ziftbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data); mounting the old path loses data silently.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziftbook -d ziftbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the database roles (apps/api/migrations/bootstrap.sql) on every start; idempotent.
  db-init:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ziftbook
      PGPASSWORD: ziftbook
      PGDATABASE: ziftbook
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
    volumes:
      - ./apps/api/migrations/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]

  # Applies Alembic migrations as ziftbook_migrate, then exits. Never part of app startup.
  migrate:
    build:
      context: apps/api
      target: dev
    image: ziftbook-api:dev
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@postgres:5432/ziftbook
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: apps/api
      target: dev
    image: ziftbook-api:dev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      start_period: 60s
      start_interval: 1s
      interval: 60s
      timeout: 3s
    develop:
      watch:
        - action: sync
          path: apps/api/app
          target: /app/app
        - action: rebuild
          path: apps/api/pyproject.toml
        - action: rebuild
          path: apps/api/uv.lock

volumes:
  pgdata:
