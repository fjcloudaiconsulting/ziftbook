[project]
name = "ziftbook-api"
version = "0.0.0"
requires-python = "==3.15.*"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "boto3==1.43.118",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "mailgun==1.10.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "phonenumbers==9.0.41",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "requests==2.34.2",
    "segno==1.6.6",
    "sqlalchemy==2.1.6",
    "stripe==16.0.0",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]==1.43.118",
    "httpx2",
    "moto[s3]==5.2.4",
    "mypy==2.4.0",
    "pytest",
    "pytest-xdist",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Raised inside starlette.testclient itself, not our code; drop once Starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
file_template = "%%(rev)s_%%(slug)s"
