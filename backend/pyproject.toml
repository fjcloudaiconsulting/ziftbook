[project]
name = "ziftbook-api"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "tzdata==2026.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy==2.4.0",
    "pytest",
    "pytest-xdist",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Raised inside starlette.testclient itself, not our code; drop once Starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
file_template = "%%(rev)s_%%(slug)s"
