name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing. Main runs are
# keyed by sha so a queued run is never replaced by a newer push: every main commit needs its own sha-<7> images.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: sh .githooks/commit-msg.test.sh
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/check-catalogs.mjs
      - run: node scripts/check-env-names.mjs
      - run: node scripts/check-env-doc.mjs
      - name: No build-time public env vars in the web app
        run: |
          if grep -rn "NEXT_PUBLIC_" frontend --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "NEXT_PUBLIC_* is baked in at build time; read configuration at runtime instead." && exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: ziftbook
          POSTGRES_PASSWORD: ziftbook
          POSTGRES_DB: ziftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziftbook -d ziftbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # CI-only credentials for the throwaway service container, matching the local dev defaults.
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@localhost:5432/ziftbook
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@localhost:5432/ziftbook
      ZIF_SMTP_HOST: localhost
      ZIF_SMTP_PORT: "1025"
      ZIF_SMTP_STARTTLS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Same role bootstrap as local dev and future hosting, using the service container's own psql.
      - name: Bootstrap database roles
        run: >-
          docker exec -i
          -e ZIF_MIGRATE_PASSWORD -e ZIF_APP_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook -f -
          < migrations/bootstrap.sql
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations
      # Serial, no -n: the file whose own tests assert the serial path (ZIF-111) still passes
      # without xdist.
      - run: uv run pytest -q tests/test_parallel_safety.py
      - run: uv run pytest -n auto

  # Built once, on the main push, as sha-<7> (pull requests build without pushing). Release only retags these.
  image:
    strategy:
      matrix:
        include:
          - { image: backend, context: backend, target: prod, build-contexts: '' }
          - { image: migrations, context: backend, target: migrations, build-contexts: '' }
          # The frontend build reads the committed OpenAPI contract from the backend directory.
          - { image: frontend, context: frontend, target: prod, build-contexts: 'backend=backend' }
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
      build-contexts: ${{ matrix.build-contexts }}

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # pnpm version comes from packageManager in frontend/package.json.
      - run: corepack enable
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test

  # Aggregate checks, the names branch protection requires. Always run; fail unless every gated job passed or was skipped.
  backend-checks:
    name: Backend Checks
    if: always()
    needs: [repo, api, image]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  frontend-checks:
    name: Frontend Checks
    if: always()
    needs: [web, landing, image]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  # Releases only when every job above passed on this commit of main. Same run as the image builds, so the tagged
  # release commit's sha-<7> images exist by the time promote runs.
  release:
    name: Release PR and tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo, api, image, web, landing]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please acts on main as it is now, not on this commit. If main has moved on, a merged Release PR there
      # has not passed CI yet, so leave it to the newer commit's run.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "main is at $head; skipping"; fi
      # An App token, not GITHUB_TOKEN, so the Release PR triggers CI and can satisfy required checks.
      - id: app
        if: steps.head.outputs.latest == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        if: steps.head.outputs.latest == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    needs: [release, image]
    if: needs.release.outputs.release_created == 'true'
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/promote-release.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      images: backend frontend migrations

  smoke:
    needs: [release, promote]
    if: needs.release.outputs.release_created == 'true'
    permissions: { contents: read, packages: read }
    uses: fjcloudaiconsulting/.github/.github/workflows/smoke.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      health-url: http://localhost:3000/api/healthz
