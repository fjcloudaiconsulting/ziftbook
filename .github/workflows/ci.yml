name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing. Main runs are
# keyed by sha so a queued run is never replaced by a newer push: every main commit needs its own sha-<7> images.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    name: Repo Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test the commit-msg hook
        run: sh .githooks/commit-msg.test.sh
      - name: Run repo script tests
        run: node --test "scripts/*.test.mjs"
      - name: Check message catalogs
        run: node scripts/check-catalogs.mjs
      - name: Check env names
        run: node scripts/check-env-names.mjs
      - name: Check env docs
        run: node scripts/check-env-doc.mjs
      - name: No build-time public env vars in the web app
        run: |
          if grep -rn "NEXT_PUBLIC_" frontend --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "NEXT_PUBLIC_* is baked in at build time; read configuration at runtime instead." && exit 1
          fi
      - name: No Docker Hub images
        uses: fjcloudaiconsulting/.github/actions/no-docker-hub@v1

  api:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: ziftbook
          POSTGRES_PASSWORD: ziftbook
          POSTGRES_DB: ziftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziftbook -d ziftbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # CI-only credentials for the throwaway service container, matching the local dev defaults.
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@localhost:5432/ziftbook
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@localhost:5432/ziftbook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv version from backend/.tool-versions (uv line only), Python from backend/.python-version.
      - name: Install backend dependencies
        uses: fjcloudaiconsulting/.github/actions/uv-sync@v1
      # Same role bootstrap as local dev and future hosting, using the service container's own psql.
      - name: Bootstrap database roles
        run: >-
          docker exec -i
          -e ZIF_MIGRATE_PASSWORD -e ZIF_APP_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook -f -
          < migrations/bootstrap.sql
      - name: Lint backend
        run: uv run ruff check .
      - name: Check backend format
        run: uv run ruff format --check .
      - name: Type-check backend
        run: uv run mypy app tests migrations scripts
      # Serial, no -n: the file whose own tests assert the serial path (ZIF-111) still passes
      # without xdist.
      - name: Run backend tests (serial path)
        run: uv run pytest -q tests/test_parallel_safety.py
      - name: Run backend tests
        run: uv run pytest -n auto

  # Built once, on the main push, as sha-<7> (pull requests build without pushing). Release only retags these.
  image:
    name: Image (${{ matrix.image }})
    strategy:
      matrix:
        include:
          - { image: backend, context: backend, target: prod, build-contexts: '' }
          - { image: migrations, context: backend, target: migrations, build-contexts: '' }
          # The frontend build reads the committed OpenAPI contract from the backend directory.
          - { image: frontend, context: frontend, target: prod, build-contexts: 'backend=backend' }
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
      build-contexts: ${{ matrix.build-contexts }}

  web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from .nvmrc, pnpm from packageManager in frontend/package.json.
      - name: Install frontend dependencies
        uses: fjcloudaiconsulting/.github/actions/pnpm-install@v1
      - name: Lint frontend
        run: pnpm lint
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
      - name: Run frontend tests
        run: pnpm test

  landing:
    name: Landing Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run landing tests
        run: npm test

  # Aggregate checks, the names branch protection requires. Always run; fail unless every gated job passed or was skipped.
  backend-checks:
    name: Backend Checks
    if: always()
    needs: [repo, api, image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  frontend-checks:
    name: Frontend Checks
    if: always()
    needs: [web, landing, image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  # Releases only when every job above passed on this commit of main. Same run as the image builds, so the tagged
  # release commit's sha-<7> images exist by the time promote runs.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo, api, image, web, landing]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please acts on main as it is now, not on this commit. If main has moved on, a merged Release PR there
      # has not passed CI yet, so leave it to the newer commit's run.
      - name: Check main is at this commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "main is at $head; skipping"; fi
      # An App token, not GITHUB_TOKEN, so the Release PR triggers CI and can satisfy required checks.
      - name: Create release token
        id: app
        if: steps.head.outputs.latest == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          # A tag on the release commit counts as creating its workflow files when a later main commit changed one.
          permission-workflows: write
      - name: Run release-please
        id: release
        if: steps.head.outputs.latest == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    name: Promote
    needs: [release, image]
    if: needs.release.outputs.release_created == 'true'
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/promote-release.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      images: backend frontend migrations

  smoke:
    name: Smoke
    needs: [release, promote]
    if: needs.release.outputs.release_created == 'true'
    permissions: { contents: read, packages: read }
    uses: fjcloudaiconsulting/.github/.github/workflows/smoke.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      health-url: http://localhost:3000/api/healthz
