name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing. Main runs are
# keyed by sha so a queued run is never replaced by a newer push: every main commit needs its own sha-<7> images.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their changed paths can affect (scripts/ci-changes.mjs). A skipped job still counts
  # as passing in the aggregate checks below, which always run, so required checks never wait on a skipped job. Jobs
  # skip only on an explicit 'false': a missing or empty output runs them.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
      landing: ${{ steps.affected.outputs.landing }}
      repo: ${{ steps.affected.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pick the jobs this change can affect
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Main runs everything: promote retags every release commit's own sha-<7> images, and the release gate means
          # every job passed on this exact commit, not on some earlier one.
          if [ "$EVENT_NAME" != pull_request ]; then
            printf '%s=true\n' backend frontend landing repo | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out its merge commit, whose first parent is the base branch: the diff is the whole PR.
          git rev-parse -q --verify HEAD^2 >/dev/null || { echo "expected the pull request merge commit" >&2; exit 1; }
          # Never echo the paths: a file name is PR input, and on stdout `::add-mask::true` would blank every output.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          # backend/tests/test_tenants.py reads the top-level route folders: adding, renaming or removing one runs it.
          routes() {
            git --literal-pathspecs ls-tree -d --name-only "$1" -- \
              'frontend/app/[locale]/' 'frontend/app/[locale]/(console)/'
          }
          [ "$(routes HEAD^1)" = "$(routes HEAD)" ] || echo backend/tests/test_tenants.py >> "$RUNNER_TEMP/changed"
          node scripts/ci-changes.mjs < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  repo:
    name: Repo Checks
    needs: changes
    if: needs.changes.outputs.repo != 'false'
    runs-on: ubuntu-latest
    # Seconds of work: a script that hangs fails here, not after the 6-hour default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test the commit-msg hook
        run: sh .githooks/commit-msg.test.sh
      - name: Run repo script tests
        shell: bash
        run: node --test "scripts/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/scripts.log" && scripts/fail-on-warnings.sh "$RUNNER_TEMP/scripts.log"
      - name: Check message catalogs
        run: node scripts/check-catalogs.mjs
      - name: Check env names
        run: node scripts/check-env-names.mjs
      - name: Check env docs
        run: node scripts/check-env-doc.mjs
      - name: No build-time public env vars in the web app
        run: |
          if grep -rn "NEXT_PUBLIC_" frontend --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "NEXT_PUBLIC_* is baked in at build time; read configuration at runtime instead." && exit 1
          fi
      - name: No Docker Hub images
        uses: fjcloudaiconsulting/.github/actions/no-docker-hub@v1

  api-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv version from backend/.tool-versions (uv line only), Python from backend/.python-version.
      - name: Install backend dependencies
        uses: fjcloudaiconsulting/.github/actions/uv-sync@v1
      - name: Lint backend
        run: uv run ruff check .
      - name: Check backend format
        run: uv run ruff format --check .
      - name: Type-check backend
        run: uv run mypy app tests migrations scripts

  # ZIF-295: the suite runs in 8 shards, each on its own runner and Postgres, balanced by the recorded test times in
  # backend/.test_durations (pytest-split). A test missing from that file counts as the average, so a stale file only
  # unbalances the shards, never skips a test. Refresh with `uv run pytest -n 4 --store-durations --clean-durations`.
  api:
    name: ${{ matrix.group == 0 && 'Backend Serial Safety' || format('Backend Tests ({0}/8)', matrix.group) }}
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-latest
    strategy:
      # One failing shard still lets the others finish, so a run shows every failure at once.
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - group: 0
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_USER: ziftbook
          POSTGRES_PASSWORD: ziftbook
          POSTGRES_DB: ziftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziftbook -d ziftbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # CI-only credentials for the throwaway service container, matching the local dev defaults.
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
      ZIF_WORKER_PASSWORD: ziftbook_worker
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@localhost:5432/ziftbook
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@localhost:5432/ziftbook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv version from backend/.tool-versions (uv line only), Python from backend/.python-version.
      - name: Install backend dependencies
        uses: fjcloudaiconsulting/.github/actions/uv-sync@v1
      # Same role bootstrap as local dev and future hosting, using the service container's own psql.
      - name: Bootstrap database roles
        run: >-
          docker exec -i
          -e ZIF_MIGRATE_PASSWORD -e ZIF_APP_PASSWORD -e ZIF_WORKER_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook -f -
          < migrations/bootstrap.sql
      # ZIF-284: a vacuum of a table whose grants a migration just changed deadlocks the migration's
      # next ALTER on it, and failed round-trip tests twice on release commits. This Postgres is
      # thrown away after the job, so turning autovacuum off costs nothing here.
      # Only this disposable test service may discard writes on crash, so skip durability work.
      - name: Configure disposable test database
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook \
            -c "ALTER SYSTEM SET autovacuum = off" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook <<'SQL'
          DO $$
          BEGIN
            IF current_setting('autovacuum') <> 'off'
              OR current_setting('fsync') <> 'off'
              OR current_setting('synchronous_commit') <> 'off'
              OR current_setting('full_page_writes') <> 'off' THEN
              RAISE EXCEPTION 'disposable test database settings did not reload';
            END IF;
          END $$;
          SQL
      # Exercise the serial path (ZIF-111) once in its own matrix job.
      - name: Run backend tests (serial path)
        if: matrix.group == 0
        run: uv run pytest -q tests/test_parallel_safety.py
      - name: Run backend tests
        if: matrix.group != 0
        run: >-
          uv run pytest -n 4 --splits 8 --group ${{ matrix.group }}
          --splitting-algorithm least_duration --durations=20
          --store-durations --clean-durations
      - name: Upload backend shard durations
        if: matrix.group != 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zif301-test-durations-${{ matrix.group }}
          path: backend/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Built once, on the main push, as sha-<7> (pull requests build without pushing). Release only retags these.
  backend-images:
    name: Image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    strategy:
      matrix:
        include:
          - { image: backend, target: prod }
          - { image: migrations, target: migrations }
    # id-token and attestations: build-image signs the image's build provenance (verified before deploy).
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: backend
      target: ${{ matrix.target }}

  frontend-image:
    name: Image (frontend)
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    # id-token and attestations: build-image signs the image's build provenance (verified before deploy).
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: frontend
      context: frontend
      target: prod
      # The frontend build reads the committed OpenAPI contract from the backend directory.
      build-contexts: backend=backend

  web:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from .nvmrc, pnpm from packageManager in frontend/package.json.
      - name: Install frontend dependencies
        uses: fjcloudaiconsulting/.github/actions/pnpm-install@v1
      - name: Lint frontend
        run: pnpm lint
      - name: Type-check frontend
        run: pnpm typecheck
      # Next's build cache: faster builds. A missing one also makes next build warn on CI.
      - name: Restore the Next build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/*.ts', 'frontend/app/**', 'frontend/lib/**', 'frontend/i18n/**', 'frontend/messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      # ZIF-153: Next's ⚠ lines and Node runtime warnings fail the step (scripts/fail-on-warnings.sh).
      # bash here runs with pipefail, so a failing build or test fails the step too.
      - name: Build frontend
        shell: bash
        run: pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log" && ../scripts/fail-on-warnings.sh "$RUNNER_TEMP/build.log"
      - name: Run frontend tests
        shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log" && ../scripts/fail-on-warnings.sh "$RUNNER_TEMP/test.log"

  landing:
    name: Landing Tests
    needs: changes
    if: needs.changes.outputs.landing != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run landing tests
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/landing.log" && ../scripts/fail-on-warnings.sh "$RUNNER_TEMP/landing.log"

  # Aggregate checks, the names branch protection requires. Always run; fail unless every gated job passed or was skipped.
  # `changes` is gated too: if it fails, every job after it skips, and skipped alone would read as passing.
  backend-checks:
    name: Backend Checks
    if: always()
    needs: [changes, repo, api-lint, api, backend-images]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  frontend-checks:
    name: Frontend Checks
    if: always()
    needs: [changes, web, landing, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  # Releases only when both aggregate checks passed on this commit of main (main skips no job). Same run as the image
  # builds, so the tagged release commit's sha-<7> images exist by the time promote runs. The shared workflow runs
  # release-please (App token from this repo's `release` environment), then promote and smoke on a release.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]
    permissions:
      contents: read
      checks: read
      pull-requests: read
      packages: write
      attestations: read # the nested promote verifies each image's provenance before retagging it
    uses: fjcloudaiconsulting/.github/.github/workflows/release.yml@v1
    with:
      images: backend frontend migrations
      health-url: http://localhost:3000/api/healthz
    secrets: inherit
