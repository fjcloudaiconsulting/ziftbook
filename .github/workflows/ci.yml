name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing. Main runs are
# keyed by sha so a queued run is never replaced by a newer push: every main commit needs its own sha-<7> images.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their changed paths can affect (scripts/ci-changes.mjs). A skipped job still counts
  # as passing in the aggregate checks below, which always run, so required checks never wait on a skipped job. Jobs
  # skip only on an explicit 'false': a missing or empty output runs them.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
      landing: ${{ steps.affected.outputs.landing }}
      repo: ${{ steps.affected.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pick the jobs this change can affect
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Main runs everything: promote retags every release commit's own sha-<7> images, and the release gate means
          # every job passed on this exact commit, not on some earlier one.
          if [ "$EVENT_NAME" != pull_request ]; then
            printf '%s=true\n' backend frontend landing repo | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out its merge commit, whose first parent is the base branch: the diff is the whole PR.
          git rev-parse -q --verify HEAD^2 >/dev/null || { echo "expected the pull request merge commit" >&2; exit 1; }
          # Never echo the paths: a file name is PR input, and on stdout `::add-mask::true` would blank every output.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          # backend/tests/test_tenants.py reads the top-level route folders: adding, renaming or removing one runs it.
          routes() {
            git --literal-pathspecs ls-tree -d --name-only "$1" -- \
              'frontend/app/[locale]/' 'frontend/app/[locale]/(console)/'
          }
          [ "$(routes HEAD^1)" = "$(routes HEAD)" ] || echo backend/tests/test_tenants.py >> "$RUNNER_TEMP/changed"
          node scripts/ci-changes.mjs < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  repo:
    name: Repo Checks
    needs: changes
    if: needs.changes.outputs.repo != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test the commit-msg hook
        run: sh .githooks/commit-msg.test.sh
      - name: Run repo script tests
        run: node --test "scripts/*.test.mjs"
      - name: Check message catalogs
        run: node scripts/check-catalogs.mjs
      - name: Check env names
        run: node scripts/check-env-names.mjs
      - name: Check env docs
        run: node scripts/check-env-doc.mjs
      - name: No build-time public env vars in the web app
        run: |
          if grep -rn "NEXT_PUBLIC_" frontend --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "NEXT_PUBLIC_* is baked in at build time; read configuration at runtime instead." && exit 1
          fi
      - name: No Docker Hub images
        uses: fjcloudaiconsulting/.github/actions/no-docker-hub@v1

  api:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: ziftbook
          POSTGRES_PASSWORD: ziftbook
          POSTGRES_DB: ziftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziftbook -d ziftbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # CI-only credentials for the throwaway service container, matching the local dev defaults.
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@localhost:5432/ziftbook
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@localhost:5432/ziftbook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv version from backend/.tool-versions (uv line only), Python from backend/.python-version.
      - name: Install backend dependencies
        uses: fjcloudaiconsulting/.github/actions/uv-sync@v1
      # Same role bootstrap as local dev and future hosting, using the service container's own psql.
      - name: Bootstrap database roles
        run: >-
          docker exec -i
          -e ZIF_MIGRATE_PASSWORD -e ZIF_APP_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook -f -
          < migrations/bootstrap.sql
      - name: Lint backend
        run: uv run ruff check .
      - name: Check backend format
        run: uv run ruff format --check .
      - name: Type-check backend
        run: uv run mypy app tests migrations scripts
      # Serial, no -n: the file whose own tests assert the serial path (ZIF-111) still passes
      # without xdist.
      - name: Run backend tests (serial path)
        run: uv run pytest -q tests/test_parallel_safety.py
      - name: Run backend tests
        run: uv run pytest -n auto

  # Built once, on the main push, as sha-<7> (pull requests build without pushing). Release only retags these.
  backend-images:
    name: Image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    strategy:
      matrix:
        include:
          - { image: backend, target: prod }
          - { image: migrations, target: migrations }
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: backend
      target: ${{ matrix.target }}

  frontend-image:
    name: Image (frontend)
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: frontend
      context: frontend
      target: prod
      # The frontend build reads the committed OpenAPI contract from the backend directory.
      build-contexts: backend=backend

  web:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from .nvmrc, pnpm from packageManager in frontend/package.json.
      - name: Install frontend dependencies
        uses: fjcloudaiconsulting/.github/actions/pnpm-install@v1
      - name: Lint frontend
        run: pnpm lint
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
      - name: Run frontend tests
        run: pnpm test

  landing:
    name: Landing Tests
    needs: changes
    if: needs.changes.outputs.landing != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run landing tests
        run: npm test

  # Aggregate checks, the names branch protection requires. Always run; fail unless every gated job passed or was skipped.
  # `changes` is gated too: if it fails, every job after it skips, and skipped alone would read as passing.
  backend-checks:
    name: Backend Checks
    if: always()
    needs: [changes, repo, api, backend-images]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  frontend-checks:
    name: Frontend Checks
    if: always()
    needs: [changes, web, landing, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  # Releases only when both aggregate checks passed on this commit of main (main skips no job). Same run as the image
  # builds, so the tagged release commit's sha-<7> images exist by the time promote runs. The shared workflow runs
  # release-please (App token from this repo's `release` environment), then promote and smoke on a release.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]
    permissions:
      contents: read
      checks: read
      pull-requests: read
      packages: write
    uses: fjcloudaiconsulting/.github/.github/workflows/release.yml@v1
    with:
      images: backend frontend migrations
      health-url: http://localhost:3000/api/healthz
    secrets: inherit
