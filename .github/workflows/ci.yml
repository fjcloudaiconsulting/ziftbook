name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Squash merges make the PR title the commit on main, which release-please reads.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh .githooks/commit-msg "$RUNNER_TEMP/title"

  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sh .githooks/commit-msg.test.sh
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/check-catalogs.mjs
      - run: node scripts/check-env-names.mjs
      - run: node scripts/check-env-doc.mjs
      - name: No build-time public env vars in the web app
        run: |
          if grep -rn "NEXT_PUBLIC_" frontend --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "NEXT_PUBLIC_* is baked in at build time; read configuration at runtime instead." && exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ziftbook
          POSTGRES_PASSWORD: ziftbook
          POSTGRES_DB: ziftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziftbook -d ziftbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # CI-only credentials for the throwaway service container, matching the local dev defaults.
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@localhost:5432/ziftbook
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@localhost:5432/ziftbook
      ZIF_SMTP_HOST: localhost
      ZIF_SMTP_PORT: "1025"
      ZIF_SMTP_STARTTLS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Same role bootstrap as local dev and future hosting, using the service container's own psql.
      - name: Bootstrap database roles
        run: >-
          docker exec -i
          -e ZIF_MIGRATE_PASSWORD -e ZIF_APP_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ziftbook -d ziftbook -f -
          < migrations/bootstrap.sql
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations
      # Serial, no -n: the file whose own tests assert the serial path (ZIF-111) still passes
      # without xdist.
      - run: uv run pytest -q tests/test_parallel_safety.py
      - run: uv run pytest -n auto

  image:
    name: ${{ matrix.image }} image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: backend, context: backend, target: prod }
          - { image: migrations, context: backend, target: migrations }
          - { image: frontend, context: frontend, target: prod }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # The frontend build reads the committed OpenAPI contract from the backend directory.
          build-contexts: backend=backend
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm version comes from packageManager in frontend/package.json.
      - run: corepack enable
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  # Releases only when every check above passed on this commit of main.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo, api, image, web, landing]
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    uses: ./.github/workflows/release.yml
