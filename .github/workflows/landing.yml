name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Landing
    runs-on: ubuntu-latest
    # INFRA-113: CLOUDFLARE_API_TOKEN is a secret of the `landing` environment (deployment branches: main only),
    # an account-owned token with the Editor role scoped to the ziftbook-landing Worker alone. Not a repo secret
    # that a workflow on any branch could read.
    environment: landing
    # A dispatch from another branch skips instead of failing on the environment's branch policy.
    if: github.ref == 'refs/heads/main'
    env:
      # 'true' once the token is stored; until then the deploy and smoke steps skip and the job stays green.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run landing tests
        run: npm test
      - name: Build landing
        run: npm run build
      - name: Skip deploy (no CLOUDFLARE_API_TOKEN)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set in the landing environment, skipping the ziftbook-landing deploy"
      # Worker, assets and account come from wrangler.jsonc. The custom domains are attached in the dashboard and a
      # deploy leaves them alone (see wrangler.jsonc).
      - if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: landing
          command: deploy
      - name: Smoke test the live site
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          # Retries ride out transient edge errors. The checks prove the custom domains still serve, not that this version landed.
          check() {
            for _ in $(seq 1 60); do
              headers=$(curl -sI --max-time 10 "$1" || true)
              if printf '%s' "$headers" | grep -qiE "$2"; then echo "ok  $1"; return 0; fi
              sleep 5
            done
            echo "FAIL $1 (expected /$2/)"; printf '%s\n' "$headers"; return 1
          }
          check https://ziftbook.com/en/     '^strict-transport-security: max-age=31536000'
          check https://www.ziftbook.com/nl/ '^location: https://ziftbook.com/nl/'
          check http://ziftbook.com/pt/      '^location: https://ziftbook.com/pt/'
