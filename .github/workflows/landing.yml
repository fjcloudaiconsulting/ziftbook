name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      # Worker, assets, both custom domains (DNS records and certificates) and the account all come from wrangler.jsonc.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.131.1"
          workingDirectory: landing
          command: deploy
      - name: Smoke test the live site
        run: |
          # Retries cover certificate provisioning on a first deploy of a new custom domain.
          check() {
            for attempt in $(seq 1 60); do
              headers=$(curl -sI --max-time 10 "$1" || true)
              if printf '%s' "$headers" | grep -qiE "$2"; then echo "ok  $1"; return 0; fi
              sleep 5
            done
            echo "FAIL $1 (expected /$2/)"; printf '%s\n' "$headers"; return 1
          }
          check https://ziftbook.com/en/     '^strict-transport-security: max-age=31536000'
          check https://www.ziftbook.com/nl/ '^location: https://ziftbook.com/nl/'
          check http://ziftbook.com/pt/      '^location: https://ziftbook.com/pt/'
