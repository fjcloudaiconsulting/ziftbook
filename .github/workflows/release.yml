name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    # Opens or updates the Release PR from Conventional Commits; merging that PR tags vX.Y.Z and creates the release.
    # Uses GITHUB_TOKEN, so the repo setting "Allow GitHub Actions to create and approve pull requests" must be on.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Built in the same run as the release: a tag pushed with GITHUB_TOKEN does not trigger other workflows.
  images:
    name: Publish ${{ matrix.app }} image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI labels include org.opencontainers.image.source, which links the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ziftbook-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          # The web build reads the committed OpenAPI contract from the api directory.
          build-contexts: api=apps/api
          target: prod
          platforms: linux/amd64
          build-args: ZIF_APP_VERSION=${{ needs.release-please.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: Smoke test published images
    needs: [release-please, images]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One request through the web proxy checks both images and the version baked into the api.
      - run: |
          docker network create smoke
          docker run -d --name api --network smoke "$REGISTRY/ziftbook-api:v$VERSION"
          docker run -d --name web --network smoke -p 3000:3000 -e ZIF_API_URL=http://api:8000 "$REGISTRY/ziftbook-web:v$VERSION"
          body=$(curl -sf --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/api/healthz) || { docker logs api; docker logs web; exit 1; }
          echo "$body"
          jq -e --arg v "$VERSION" '.status == "ok" and .version == $v' <<<"$body"
