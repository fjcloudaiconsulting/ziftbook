name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    # Opens or updates the Release PR from Conventional Commits; merging that PR tags vX.Y.Z and creates the release.
    # Uses GITHUB_TOKEN, so the repo setting "Allow GitHub Actions to create and approve pull requests" must be on.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
