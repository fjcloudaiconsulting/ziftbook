# Local development stack. Credentials here are for localhost only and never used elsewhere.

# Fixed addresses, so the backend can trust exactly the frontend (ZIF_TRUSTED_PROXIES). If this
# subnet collides with a local network or VPN, change it here, in ip_range, and in both addresses
# below.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Other containers get addresses from here, so none can take the frontend's before it
          # starts.
          ip_range: 172.28.0.128/25

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ziftbook
      POSTGRES_PASSWORD: ziftbook
      POSTGRES_DB: ziftbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data); mounting the old path loses data silently.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziftbook -d ziftbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the database roles (backend/migrations/bootstrap.sql) on every start; idempotent.
  db-init:
    image: mirror.gcr.io/library/postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ziftbook
      PGPASSWORD: ziftbook
      PGDATABASE: ziftbook
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
    volumes:
      - ./backend/migrations/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]

  # Init container: applies migrations as ziftbook_migrate with the migrations image, then exits. The backend starts only if it succeeds.
  migrate:
    build:
      context: backend
      target: migrations
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@postgres:5432/ziftbook
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet

  backend:
    build:
      context: backend
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@postgres:5432/ziftbook
      ZIF_TRUSTED_PROXIES: 172.28.0.10
      ZIF_TURNSTILE_DISABLED: "true" # no secret in development; without it every public booking is refused
      ZIF_SETUP_TOKEN: dev-only-setup-token-not-a-secret-0000 # development only, not a secret; make seed uses it (Makefile)
      ZIF_TOTP_KEY: ZGV2LW9ubHktdG90cC1rZXktbm90LWEtc2VjcmV0ISE= # development only, not a secret
      ZIF_RATE_LIMIT_KEY: dev-only-rate-limit-key-not-a-secret-0000 # development only, not a secret
      # Photo storage (ZIF-133): the dev object store below. Dev keys, not secrets. The browser
      # PUTs to the public endpoint; the services reach the store by its compose name.
      ZIF_S3_ENDPOINT: http://seaweedfs:8333
      ZIF_S3_PUBLIC_ENDPOINT: http://localhost:8333
      ZIF_S3_UPLOADS_BUCKET: ziftbook-uploads
      ZIF_S3_MEDIA_BUCKET: ziftbook-media
      ZIF_S3_ACCESS_KEY_ID: dev
      ZIF_S3_SECRET_ACCESS_KEY: dev-secret
      ZIF_MEDIA_URL: http://localhost:8333/ziftbook-media
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      start_period: 60s
      start_interval: 1s
      interval: 60s
      timeout: 3s
    develop:
      watch:
        - action: sync
          path: backend/app
          target: /app/app
        - action: rebuild
          path: backend/pyproject.toml
        - action: rebuild
          path: backend/uv.lock

  # Background jobs, from the backend image with another command.
  worker:
    build:
      context: backend
      target: dev
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@postgres:5432/ziftbook
      # Mailpit's HTTP send API, never SMTP (ZIF-151); a Mailgun key would take precedence.
      ZIF_MAILPIT_URL: http://mailpit:8025
      ZIF_RATE_LIMIT_KEY: dev-only-rate-limit-key-not-a-secret-0000 # development only, not a secret
      # Photo storage (ZIF-133): the dev object store below. Dev keys, not secrets. The browser
      # PUTs to the public endpoint; the services reach the store by its compose name.
      ZIF_S3_ENDPOINT: http://seaweedfs:8333
      ZIF_S3_PUBLIC_ENDPOINT: http://localhost:8333
      ZIF_S3_UPLOADS_BUCKET: ziftbook-uploads
      ZIF_S3_MEDIA_BUCKET: ziftbook-media
      ZIF_S3_ACCESS_KEY_ID: dev
      ZIF_S3_SECRET_ACCESS_KEY: dev-secret
      ZIF_MEDIA_URL: http://localhost:8333/ziftbook-media
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
    develop:
      watch:
        - action: sync+restart
          path: backend/app
          target: /app/app
        - action: rebuild
          path: backend/uv.lock

  frontend:
    build:
      context: frontend
      additional_contexts:
        backend: backend
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    # After the API answers /api/healthz, so a tab left open across `make up` or `make reset` doesn't
    # hit ECONNREFUSED while the backend is still starting (its start_interval is 1s).
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ZIF_API_URL: http://backend:8000
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
    networks:
      default:
        ipv4_address: 172.28.0.10
    develop:
      watch:
        - action: sync
          path: frontend
          target: /src/frontend
          ignore:
            - node_modules/
            - .next/
            - api-client/
        - action: rebuild
          path: frontend/package.json
        - action: rebuild
          path: frontend/pnpm-lock.yaml
        # A changed API contract regenerates the typed client.
        - action: rebuild
          path: backend/openapi.json

  # Catches every email sent locally, through its HTTP API: http://localhost:8025
  mailpit:
    image: mirror.gcr.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:8025:8025"
    # The image's own check plus a network: a retry after a failed port bind can leave Mailpit
    # running with no network at all, which readyz alone reports as healthy (ZIF-91).
    healthcheck:
      test: ["CMD-SHELL", "/mailpit readyz && test -e /sys/class/net/eth0"]
      start_period: 10s
      start_interval: 1s
      interval: 15s

  # Photo storage in development (ZIF-133): an S3-compatible API on http://localhost:8333, one dev
  # identity (the keys in the backend's environment) and no anonymous access; the bucket
  # policy below opens the media bucket for reading.
  seaweedfs:
    image: mirror.gcr.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      start_period: 20s
      start_interval: 1s
      interval: 15s

  # Creates the two buckets, the media bucket's public-read policy and the uploads bucket's CORS
  # (the browser PUTs from the web app's origin) on every start; idempotent.
  seaweedfs-init:
    image: mirror.gcr.io/amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in ziftbook-uploads ziftbook-media; do
          aws s3api head-bucket --bucket $$bucket 2>/dev/null || aws s3api create-bucket --bucket $$bucket
        done
        aws s3api put-bucket-policy --bucket ziftbook-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::ziftbook-media/*"}]}'
        aws s3api put-bucket-cors --bucket ziftbook-uploads --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["PUT"],"AllowedHeaders":["content-type"],"MaxAgeSeconds":3600}]}'

configs:
  seaweedfs-s3:
    content: |
      {"identities": [{"name": "dev", "credentials": [{"accessKey": "dev", "secretKey": "dev-secret"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  pgdata:
  seaweedfs:
