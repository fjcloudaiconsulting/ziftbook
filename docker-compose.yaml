# Local development stack. Credentials here are for localhost only and never used elsewhere.

# Fixed addresses, so the backend can trust exactly the frontend (ZIF_TRUSTED_PROXIES). If this
# subnet collides with a local network or VPN, change it here, in ip_range, and in both addresses
# below.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Other containers get addresses from here, so none can take the frontend's before it
          # starts.
          ip_range: 172.28.0.128/25

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ziftbook
      POSTGRES_PASSWORD: ziftbook
      POSTGRES_DB: ziftbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data); mounting the old path loses data silently.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziftbook -d ziftbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the database roles (backend/migrations/bootstrap.sql) on every start; idempotent.
  db-init:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ziftbook
      PGPASSWORD: ziftbook
      PGDATABASE: ziftbook
      ZIF_MIGRATE_PASSWORD: ziftbook_migrate
      ZIF_APP_PASSWORD: ziftbook_app
    volumes:
      - ./backend/migrations/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]

  # Init container: applies migrations as ziftbook_migrate with the migrations image, then exits. The backend starts only if it succeeds.
  migrate:
    build:
      context: backend
      target: migrations
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:ziftbook_migrate@postgres:5432/ziftbook
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}

  backend:
    build:
      context: backend
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@postgres:5432/ziftbook
      ZIF_TRUSTED_PROXIES: 172.28.0.10
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      start_period: 60s
      start_interval: 1s
      interval: 60s
      timeout: 3s
    develop:
      watch:
        - action: sync
          path: backend/app
          target: /app/app
        - action: rebuild
          path: backend/pyproject.toml
        - action: rebuild
          path: backend/uv.lock

  # Background jobs, from the backend image with another command.
  worker:
    build:
      context: backend
      target: dev
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:ziftbook_app@postgres:5432/ziftbook
      ZIF_SMTP_HOST: mailpit
      ZIF_SMTP_PORT: "1025"
      ZIF_SMTP_STARTTLS: "false"
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
    develop:
      watch:
        - action: sync+restart
          path: backend/app
          target: /app/app
        - action: rebuild
          path: backend/uv.lock

  frontend:
    build:
      context: frontend
      additional_contexts:
        backend: backend
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    # After the API answers /api/healthz, so a tab left open across `make up` or `make reset` doesn't
    # hit ECONNREFUSED while the backend is still starting (its start_interval is 1s).
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ZIF_API_URL: http://backend:8000
      ZIF_LOG_LEVEL: DEBUG
      ZIF_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
    networks:
      default:
        ipv4_address: 172.28.0.10
    develop:
      watch:
        - action: sync
          path: frontend
          target: /src/frontend
          ignore:
            - node_modules/
            - .next/
            - api-client/
        - action: rebuild
          path: frontend/package.json
        - action: rebuild
          path: frontend/pnpm-lock.yaml
        # A changed API contract regenerates the typed client.
        - action: rebuild
          path: backend/openapi.json

  # Catches every email sent locally: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    # The image's own check plus a network: a retry after a failed port bind can leave Mailpit
    # running with no network at all, which readyz alone reports as healthy (ZIF-91).
    healthcheck:
      test: ["CMD-SHELL", "/mailpit readyz && test -e /sys/class/net/eth0"]
      start_period: 10s
      start_interval: 1s
      interval: 15s

  # Opt-in (make observe): ships the containers' logs to the shared local lgtm stack. The docker
  # socket gives it full control of the daemon, which is why it only runs under this profile.
  alloy:
    image: grafana/alloy:v1.19.2
    profiles: [observability]
    command: ["run", "/etc/alloy/logs.alloy"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/logs.alloy:/etc/alloy/logs.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
