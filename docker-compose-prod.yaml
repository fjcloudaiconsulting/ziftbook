# Production stack from the released images (docker-compose.yaml is the local development stack).
# Run from a checkout of the release tag, after `docker login ghcr.io` (the packages are private):
#   docker compose -f docker-compose-prod.yaml up -d
# Every variable this file reads, its default and whether it's required or a secret: .env.example at
# the repo root (copy it to a .env next to this file) and the "Environment variables" table in
# CONTRIBUTING.md.
# ZIF_CLIENT_IP_HEADER is not passed through here on purpose. Port 3000 is published directly, so any
# header can be forged, and every visitor shares the web app's address and its per-IP rate limits. Fine
# for trying a release; production runs on k3s behind Cloudflare (CONTRIBUTING.md, "Client IP").
name: ziftbook

# Fixed addresses, so the backend can trust exactly the frontend (ZIF_TRUSTED_PROXIES). If this
# subnet collides with a local network or VPN, change it here, in ip_range, and in both addresses
# below.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Other containers get addresses from here, so none can take the frontend's before it
          # starts.
          ip_range: 172.28.0.128/25

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziftbook
      POSTGRES_PASSWORD: ${ZIF_POSTGRES_PASSWORD:?set ZIF_POSTGRES_PASSWORD}
      POSTGRES_DB: ziftbook
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data); mounting the old path loses data silently.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziftbook -d ziftbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates or updates the database roles (backend/migrations/bootstrap.sql); idempotent, runs on every start.
  db-init:
    image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ziftbook
      PGPASSWORD: ${ZIF_POSTGRES_PASSWORD:?set ZIF_POSTGRES_PASSWORD}
      PGDATABASE: ziftbook
      ZIF_MIGRATE_PASSWORD: ${ZIF_MIGRATE_PASSWORD:?set ZIF_MIGRATE_PASSWORD}
      ZIF_APP_PASSWORD: ${ZIF_APP_PASSWORD:?set ZIF_APP_PASSWORD}
    volumes:
      - ./backend/migrations/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]

  # Init container: applies migrations as ziftbook_migrate with the migrations image, then exits. The backend starts
  # only if it succeeds; rerunning at head is a no-op.
  migrate:
    image: ghcr.io/fjcloudaiconsulting/ziftbook/migrations:${ZIF_IMAGE_TAG:?set ZIF_IMAGE_TAG}
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ZIF_MIGRATE_DATABASE_URL: postgresql+psycopg://ziftbook_migrate:${ZIF_MIGRATE_PASSWORD:?set ZIF_MIGRATE_PASSWORD}@postgres:5432/ziftbook
      ZIF_LOG_LEVEL: ${ZIF_LOG_LEVEL:-INFO}
      ZIF_LOG_FORMAT: ${ZIF_LOG_FORMAT:-json}
      ZIF_LOG_SQL: ${ZIF_LOG_SQL:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
      OTEL_TRACES_SAMPLER: ${ZIF_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${ZIF_OTEL_TRACES_SAMPLER_ARG:-0.1}

  backend:
    image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:${ZIF_IMAGE_TAG:?set ZIF_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:${ZIF_APP_PASSWORD:?set ZIF_APP_PASSWORD}@postgres:5432/ziftbook
      ZIF_LOG_LEVEL: ${ZIF_LOG_LEVEL:-INFO}
      ZIF_LOG_FORMAT: ${ZIF_LOG_FORMAT:-json}
      ZIF_LOG_SQL: ${ZIF_LOG_SQL:-false}
      ZIF_TRUSTED_PROXIES: 172.28.0.10
      ZIF_TURNSTILE_SECRET: ${ZIF_TURNSTILE_SECRET:-}
      ZIF_TURNSTILE_DISABLED: ${ZIF_TURNSTILE_DISABLED:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
      OTEL_TRACES_SAMPLER: ${ZIF_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${ZIF_OTEL_TRACES_SAMPLER_ARG:-0.1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      start_interval: 1s

  # Background jobs, from the backend image with another command. SIGTERM lets the current batch finish.
  worker:
    image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:${ZIF_IMAGE_TAG:?set ZIF_IMAGE_TAG}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ZIF_DATABASE_URL: postgresql+psycopg://ziftbook_app:${ZIF_APP_PASSWORD:?set ZIF_APP_PASSWORD}@postgres:5432/ziftbook
      ZIF_LOG_LEVEL: ${ZIF_LOG_LEVEL:-INFO}
      ZIF_LOG_FORMAT: ${ZIF_LOG_FORMAT:-json}
      ZIF_LOG_SQL: ${ZIF_LOG_SQL:-false}
      ZIF_HEALTHCHECK_URL: ${ZIF_HEALTHCHECK_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${ZIF_OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
      OTEL_TRACES_SAMPLER: ${ZIF_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${ZIF_OTEL_TRACES_SAMPLER_ARG:-0.1}
      # Mailgun's HTTP API (see MailSettings); no key: the worker runs and email jobs fail.
      ZIF_MAILGUN_API_KEY: ${ZIF_MAILGUN_API_KEY:-}
      ZIF_MAILGUN_DOMAIN: ${ZIF_MAILGUN_DOMAIN:-}
      ZIF_MAILGUN_REGION: ${ZIF_MAILGUN_REGION:-}
      ZIF_APP_URL: ${ZIF_APP_URL:?set ZIF_APP_URL}

  # The only published port; /api is forwarded to the backend on the internal network.
  frontend:
    image: ghcr.io/fjcloudaiconsulting/ziftbook/frontend:${ZIF_IMAGE_TAG:?set ZIF_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ZIF_API_URL: http://backend:8000
      ZIF_LOG_LEVEL: ${ZIF_LOG_LEVEL:-INFO}
      ZIF_LOG_FORMAT: ${ZIF_LOG_FORMAT:-json}
      ZIF_TURNSTILE_SITE_KEY: ${ZIF_TURNSTILE_SITE_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZIF_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${ZIF_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: none # stdout only; also keeps a rolled-back image (OTLP logs) quiet
      OTEL_TRACES_SAMPLER: ${ZIF_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${ZIF_OTEL_TRACES_SAMPLER_ARG:-0.1}
    ports:
      - "3000:3000"
    networks:
      default:
        ipv4_address: 172.28.0.10

volumes:
  pgdata:
